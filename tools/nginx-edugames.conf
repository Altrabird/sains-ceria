# nginx site for https://edugames.altrabird.click — static Sains Ceria hub (dist/web uploaded to /var/www/edugames).
# Install: cp tools/nginx-edugames.conf /etc/nginx/sites-available/edugames && nginx -t && systemctl reload nginx
server {
    listen 443 ssl;
    server_name edugames.altrabird.click;
    ssl_certificate /etc/letsencrypt/live/edugames.altrabird.click/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/edugames.altrabird.click/privkey.pem; # managed by Certbot

    root /var/www/edugames;
    index index.html;

    # MediaPipe hand tracking + ES modules need the right types (a types block replaces the inherited table: include it first)
    include /etc/nginx/mime.types;
    types { text/javascript mjs; application/octet-stream task; application/manifest+json webmanifest; }

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json application/manifest+json application/wasm image/svg+xml;
    gzip_min_length 1024;

    # the hub page, game list and service worker must always be fresh so updates reach phones
    location ~ ^/(index\.html|games\.json|sw\.js|manifest\.webmanifest)$ { add_header Cache-Control "no-cache"; }
    location = / { add_header Cache-Control "no-cache"; try_files /index.html =404; }

    # everything else (games, models, audio, icons, fonts) can be cached; service worker revalidates
    location / {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "public, max-age=3600";
    }
}
server {
    if ($host = edugames.altrabird.click) {
        return 301 https://$host$request_uri;
    } # managed by Certbot
    listen 80;
    server_name edugames.altrabird.click;
    return 404; # managed by Certbot
}
