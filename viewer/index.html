<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Galeri Aset AR Sains</title>
<style>
  :root { --bg:#fff7fa; --fg:#2b2340; --card:#fff; --line:#f1d5e0; --accent:#e0457b; --muted:#7a6c85; }
  @media (prefers-color-scheme: dark) { :root { --bg:#17131f; --fg:#f3eef8; --card:#221c2e; --line:#3a2f4a; --accent:#ff7aa8; --muted:#a898b8; } }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:16px; display:flex; gap:12px; flex-wrap:wrap; align-items:center; border-bottom:1px solid var(--line); }
  h1 { font-size:18px; margin:0 auto 0 0; }
  select, input, button { font:inherit; padding:6px 10px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--fg); }
  #grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; padding:16px; }
  .tile { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:8px; cursor:pointer; }
  .tile:hover { border-color:var(--accent); }
  .tile img { width:100%; aspect-ratio:1; display:block; border-radius:8px; background:#e9e3ee; }
  .tile b { display:block; font-size:12px; margin-top:6px; word-break:break-all; }
  .tile span { font-size:11px; color:var(--muted); }
  #detail { position:fixed; inset:0; background:var(--bg); display:none; grid-template-columns:1fr 320px; }
  #detail.on { display:grid; }
  #stage { position:relative; min-height:50vh; }
  #stage canvas { display:block; width:100%; height:100%; }
  aside { border-left:1px solid var(--line); padding:16px; overflow:auto; }
  aside h2 { font-size:16px; margin:0 0 4px; }
  aside pre { font-size:11px; white-space:pre-wrap; background:var(--card); padding:8px; border-radius:8px; }
  .node { display:flex; gap:6px; align-items:center; margin:4px 0; font-size:12px; }
  .node input[type=range] { flex:1; }
  @media (max-width:700px) { #detail { grid-template-columns:1fr; grid-template-rows:55vh auto; } aside { border-left:0; } }
</style>
<script type="importmap">{ "imports": { "three": "../vendor/three/three.module.js", "three/addons/": "../vendor/three/addons/" } }</script>
</head>
<body>
<header>
  <h1>Galeri Aset AR — Rekod Amali Sains T2 <span id="count"></span></h1>
  <select id="filter"><option value="">Semua amali</option></select>
  <input id="q" placeholder="Cari…">
</header>
<div id="grid"></div>
<div id="detail">
  <div id="stage"></div>
  <aside>
    <button id="back">← Kembali</button>
    <h2 id="dName"></h2>
    <div id="dMeta"></div>
    <h3>Nod interaktif</h3>
    <div id="dNodes"></div>
    <h3>userData (fakta sains)</h3>
    <pre id="dExtras"></pre>
  </aside>
</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const manifest = await (await fetch('../assets/manifest.json')).json();
const ids = Object.keys(manifest.assets);
const loader = new GLTFLoader();
const cache = new Map();
const load = id => cache.get(id) || cache.set(id, loader.loadAsync('../assets/' + manifest.assets[id].file)).get(id);

function makeRenderer(w, h, preserve) {
  const r = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: preserve });
  r.setSize(w, h, false);
  r.toneMapping = THREE.ACESFilmicToneMapping;
  return r;
}
function makeScene(r) {
  const s = new THREE.Scene();
  s.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture;
  const sun = new THREE.DirectionalLight(0xffffff, 1.5); sun.position.set(1, 2, 1.5); s.add(sun);
  return s;
}
function frame(cam, obj, controls) {
  const box = new THREE.Box3().setFromObject(obj), c = box.getCenter(new THREE.Vector3());
  const r = box.getSize(new THREE.Vector3()).length() / 2 || 0.1;
  cam.near = r / 100; cam.far = r * 100; cam.updateProjectionMatrix();
  cam.position.copy(c).add(new THREE.Vector3(0.9, 0.7, 1.2).normalize().multiplyScalar(r / Math.sin(cam.fov * Math.PI / 360) * 1.05));
  cam.lookAt(c);
  if (controls) { controls.target.copy(c); controls.update(); }
}

// ---- thumbnails: one renderer, one asset at a time
const grid = document.getElementById('grid');
const amSet = new Set(ids.flatMap(i => manifest.assets[i].am));
for (const a of [...amSet].sort()) document.getElementById('filter').add(new Option(a, a));
document.getElementById('count').textContent = `(${ids.length})`;
const tiles = {};
for (const id of ids) {
  const a = manifest.assets[id], t = document.createElement('div');
  t.className = 'tile'; t.dataset.id = id;
  t.innerHTML = `<img alt=""><b>${id}</b><span>${a.name_bm} · ${a.am.join(' ')} · ${a.tris}▲</span>`;
  t.onclick = () => openDetail(id);
  grid.append(t); tiles[id] = t;
}
function applyFilter() {
  const f = document.getElementById('filter').value, q = document.getElementById('q').value.toLowerCase();
  for (const id of ids) {
    const a = manifest.assets[id];
    tiles[id].style.display = (!f || a.am.includes(f)) && (!q || (id + a.name_bm).toLowerCase().includes(q)) ? '' : 'none';
  }
}
document.getElementById('filter').onchange = applyFilter;
document.getElementById('q').oninput = applyFilter;

const tr = makeRenderer(256, 256, true), ts = makeScene(tr), tc = new THREE.PerspectiveCamera(35, 1);
window.thumbErrors = [];
for (const id of ids) {
  try {
    const g = (await load(id)).scene.clone();
    ts.add(g); frame(tc, g); tr.render(ts, tc); ts.remove(g);
    tiles[id].querySelector('img').src = tr.domElement.toDataURL();
  } catch (e) { window.thumbErrors.push(id + ': ' + e.message); tiles[id].style.outline = '2px solid red'; }
}
window.thumbsDone = true;

// ---- detail view
const stage = document.getElementById('stage');
let dr, ds, dc, ctl, current;
function openDetail(id) {
  document.getElementById('detail').classList.add('on');
  if (!dr) {
    dr = makeRenderer(stage.clientWidth, stage.clientHeight); stage.append(dr.domElement);
    ds = makeScene(dr); ds.background = new THREE.Color(0xe9e3ee);
    ds.add(new THREE.GridHelper(1, 100, 0xc9b8d3, 0xddd2e4));
    dc = new THREE.PerspectiveCamera(40, 1); ctl = new OrbitControls(dc, dr.domElement);
    addEventListener('resize', size); dr.setAnimationLoop(() => dr.render(ds, dc));
  }
  size();
  load(id).then(gltf => {
    if (current) ds.remove(current);
    current = gltf.scene; ds.add(current); frame(dc, current, ctl);
    const a = manifest.assets[id];
    document.getElementById('dName').textContent = `${id} — ${a.name_bm}`;
    document.getElementById('dMeta').innerHTML = `${a.am.join(', ')} · ${a.tris} segi tiga · ${(a.bytes / 1024).toFixed(0)} KB<br>saiz (m): ${a.size_m.join(' × ')}${a.note ? '<br><i>' + a.note + '</i>' : ''}`;
    document.getElementById('dExtras').textContent = JSON.stringify(current.children[0]?.userData ?? {}, null, 1);
    const box = document.getElementById('dNodes'); box.innerHTML = '';
    current.traverse(o => {
      const n = o.name;
      if (/^(stage|week)_\d+$/.test(n) || /^(beam|light|residue)$/.test(n)) {
        const row = document.createElement('label'); row.className = 'node';
        row.innerHTML = `<input type="checkbox" checked> ${n}`;
        row.firstChild.onchange = e => o.visible = e.target.checked; box.append(row);
      } else if (n.startsWith('pivot_')) {
        const row = document.createElement('div'); row.className = 'node';
        row.innerHTML = `${n} <select><option>x</option><option selected>y</option><option>z</option><option>scale</option><option>move</option></select><input type="range" min="-1" max="1" step="0.01" value="0">`;
        const [sel, rng] = row.querySelectorAll('select,input');
        const base = { r: o.rotation.clone(), s: o.scale.clone(), p: o.position.clone() };
        rng.oninput = () => {
          const v = +rng.value; o.rotation.copy(base.r); o.scale.copy(base.s); o.position.copy(base.p);
          if (sel.value === 'scale') o.scale.multiplyScalar(1 + v * 0.9);
          else if (sel.value === 'move') o.position.x += v * 0.35;
          else o.rotation[sel.value] += v * Math.PI;
        };
        box.append(row);
      } else if (n.startsWith('anchor_')) {
        const d = document.createElement('div'); d.className = 'node'; d.textContent = '◎ ' + n; box.append(d);
        const dot = new THREE.Mesh(new THREE.SphereGeometry(0.003), new THREE.MeshBasicMaterial({ color: 0xff2266, depthTest: false }));
        dot.renderOrder = 9; o.add(dot);
      }
    });
    const glow = [];
    current.traverse(o => o.material && /bulb_glass|filament/.test(o.material.name) && glow.push(o.material));
    if (glow.length) {
      const row = document.createElement('label'); row.className = 'node';
      row.innerHTML = `<input type="checkbox"> nyalakan mentol (emissive)`;
      row.firstChild.onchange = e => glow.forEach(m => { m.emissive.set(0xffd070); m.emissiveIntensity = e.target.checked ? 3 : 0; }); box.append(row);  // GLB has no emissive colour
    }
  });
}
function size() { const w = stage.clientWidth, h = stage.clientHeight; dr.setSize(w, h, false); dc.aspect = w / h; dc.updateProjectionMatrix(); }
document.getElementById('back').onclick = () => document.getElementById('detail').classList.remove('on');
const want = new URLSearchParams(location.search).get('id'); if (want) openDetail(want);
</script>
</body>
</html>
