<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Permainan Sains</title>
<style>
  :root { --bg:#f6f7fb; --card:#fff; --fg:#1d2433; --muted:#5b6475; --accent:#2b6cff; --line:#e3e6ee; }
  @media (prefers-color-scheme: dark) { :root { --bg:#10131a; --card:#1a1f2b; --fg:#e8ecf4; --muted:#9aa3b5; --accent:#6d9bff; --line:#2a3142; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.45 system-ui, sans-serif; }
  main { max-width:900px; margin:0 auto; padding:24px 16px 48px; }
  h1 { margin:0 0 4px; font-size:28px; }
  h2 { margin:28px 0 10px; font-size:18px; color:var(--muted); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:12px; }
  a.game { display:block; padding:14px 16px; border-radius:14px; background:var(--card); border:1px solid var(--line); color:inherit; text-decoration:none; }
  a.game:hover, a.game:focus-visible { border-color:var(--accent); outline:none; }
  a.game b { display:block; }
  a.game small { color:var(--muted); }
  .tag { font-size:12px; font-weight:700; color:var(--accent); }
  .empty { color:var(--muted); font-style:italic; }
</style>
</head>
<body>
<main>
  <h1>Permainan Sains</h1>
  <p style="color:var(--muted);margin:0">Sains Tahun 1–6 · guna kamera dan tangan anda</p>
  <div id="list"></div>
</main>
<script type="module">
const games = await (await fetch('games.json')).json();
const list = document.getElementById('list');
for (let y = 1; y <= 6; y++) {
  const mine = games.filter(g => g.year === y).sort((a, b) => (a.unit ?? 0) - (b.unit ?? 0));
  list.insertAdjacentHTML('beforeend', `<h2>Tahun ${y}</h2>` + (mine.length
    ? `<div class="grid">${mine.map(g => `<a class="game" href="games/${g.id}/"><span class="tag">${g.unit ? 'Unit ' + g.unit : 'Amali'}</span><b>${g.title}</b><small>${g.desc}</small></a>`).join('')}</div>`
    : `<p class="empty">Akan datang</p>`));
}
</script>
</body>
</html>
